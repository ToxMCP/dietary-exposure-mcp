name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "07 5 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install project and security tools
        run: uv sync --frozen --all-extras --all-groups
      - name: Ruff
        run: |
          if grep -q '^\[tool\.ruff' pyproject.toml; then
            uv run --frozen --all-extras --all-groups ruff check .
          fi
      - name: Tests
        run: |
          uv run --frozen --all-extras --all-groups pytest -q
      - name: Bandit
        # Gate on medium+ severity. The only findings are low-severity false
        # positives in scientific code: seeded random.Random for Monte-Carlo
        # (B311), a ReadinessStatus.PASS = "pass" enum value (B105), and
        # try/except/continue blocks that intentionally skip missing registry
        # records (B112). Medium/high issues still fail the build.
        run: |
          uv run --frozen --all-extras --all-groups bandit -r src -x tests --severity-level medium
      - name: pip-audit
        run: |
          uv lock --check
          uv export --frozen --all-extras --all-groups --no-emit-project --output-file /tmp/dietary-locked-requirements.txt
          uvx pip-audit==2.10.1 --strict --desc --no-deps --disable-pip --requirement /tmp/dietary-locked-requirements.txt
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          uv run --frozen --all-extras --all-groups cyclonedx-py environment --output-format JSON --output-file artifacts/python-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: artifacts/python-sbom.cdx.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than gitleaks-action, which requires a
      # paid GITLEAKS_LICENSE for organization-owned repos. The CLI binary is free.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
